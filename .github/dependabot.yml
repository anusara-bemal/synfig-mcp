version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/server"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      python-runtime:
        patterns: ["*"]
        exclude-patterns: ["mypy", "ruff", "pytest*", "types-*", "poethepoet", "hypothesis", "syrupy", "bandit"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
