name: Website & Docs

on:
  push:
    branches: [main, v*]
  pull_request:
    branches: [main, v*]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs-material

      - name: Build MkDocs documentation
        run: |
          # Build full documentation suite into site/docs/
          mkdocs build --strict --site-dir site/docs

      - name: Assemble promotional website at site root
        run: |
          # Copy Synfig-styled promotional website to root of site/
          cp -r website/* site/
          touch site/.nojekyll

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v7
        with:
          name: documentation-site
          path: site/
          if-no-files-found: error
          retention-days: 7

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
