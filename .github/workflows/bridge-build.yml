name: Bridge Build & Release

on:
  push:
    branches: [main, v*]
    tags: ['v*']
  pull_request:
    branches: [main, v*]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bridge-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SYNFIG_MCP_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '0.8.0-rc2' }}

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            cmake ninja-build pkg-config ccache intltool autopoint gettext \
            libxml++2.6-dev libsigc++-2.0-dev libglibmm-2.4-dev libgtkmm-3.0-dev \
            libmlt++-dev libmlt-dev libfftw3-dev libavcodec-dev libavformat-dev \
            libswscale-dev libmagick++-dev libopenexr-dev libboost-all-dev \
            libltdl-dev libharfbuzz-dev libmng-dev nlohmann-json3-dev xvfb \
            dbus dbus-x11 libgl1-mesa-dri

      - name: Fetch and build Synfig Studio
        run: |
          bash bridge/scripts/fetch_synfig.sh
          bash bridge/scripts/apply_patches.sh
          bash bridge/scripts/build_linux.sh

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./server[dev]"

      - name: Run Real Studio Tests under xvfb
        run: |
          export SYNFIG_STUDIO_PATH="${GITHUB_WORKSPACE}/build_synfig/build_linux/install/bin/synfigstudio"
          export SYNFIG_MCP_ENABLE=1
          # The installed Linux build has no RPATH; expose the bundled libraries
          # to every Studio subprocess spawned by the tests.
          export LD_LIBRARY_PATH="${GITHUB_WORKSPACE}/build_synfig/build_linux/install/lib:${LD_LIBRARY_PATH}"
          export SYNFIG_MODULE_DIR="${GITHUB_WORKSPACE}/build_synfig/build_linux/install/lib/synfig/modules"
          export GDK_BACKEND=x11
          export NO_AT_BRIDGE=1
          export LIBGL_ALWAYS_SOFTWARE=1
          # A session bus is required for Gtk::Application single-instance
          # forwarding, which one of the bridge tests exercises.
          dbus-run-session -- xvfb-run -a -s "-screen 0 1280x1024x24" \
            pytest server/tests/e2e/test_live_mutate.py server/tests/e2e/test_live_scene_build.py \
            -m real_studio -v --durations=20

      - name: Verify generated documents load in the Synfig engine
        run: |
          export PATH="${GITHUB_WORKSPACE}/build_synfig/build_linux/install/bin:${PATH}"
          export LD_LIBRARY_PATH="${GITHUB_WORKSPACE}/build_synfig/build_linux/install/lib:${LD_LIBRARY_PATH}"
          export SYNFIG_MODULE_DIR="${GITHUB_WORKSPACE}/build_synfig/build_linux/install/lib/synfig/modules"
          pytest server/tests/contract/test_sif_synfig_validity.py -v

      - name: Package Linux Artifacts
        run: |
          PACKAGE_DIR="synfigstudio-linux-mcp-$(git rev-parse --short HEAD)"
          mkdir -p "${PACKAGE_DIR}"
          cp -r build_synfig/build_linux/install/* "${PACKAGE_DIR}/"
          cp bridge/GPL_NOTICE.txt "${PACKAGE_DIR}/"
          cp bridge/THIRD_PARTY_LICENSES.md "${PACKAGE_DIR}/"
          mkdir -p "${PACKAGE_DIR}/patches"
          cp -r bridge/patches/* "${PACKAGE_DIR}/patches/"
          tar -czvf "${PACKAGE_DIR}.tar.gz" "${PACKAGE_DIR}"

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v7
        with:
          name: synfigstudio-linux-mcp
          path: synfigstudio-linux-mcp-*.tar.gz
          if-no-files-found: error
          retention-days: 14

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true

      - name: Run Windows Build
        shell: msys2 {0}
        run: |
          bash bridge/scripts/build_windows_msys2.sh

      - name: Bundle Windows Runtime Dependencies
        shell: msys2 {0}
        run: |
          python3 bridge/scripts/bundle_windows_deps.py --install-dir build_synfig/build_ucrt64/install --ucrt-dir /ucrt64

      - name: Package Windows Artifacts
        shell: msys2 {0}
        run: |
          PACKAGE_DIR="synfigstudio-windows-ucrt64-mcp-$(git rev-parse --short HEAD)"
          mkdir -p "${PACKAGE_DIR}"
          cp -r build_synfig/build_ucrt64/install/* "${PACKAGE_DIR}/"
          cp bridge/GPL_NOTICE.txt "${PACKAGE_DIR}/"
          cp bridge/THIRD_PARTY_LICENSES.md "${PACKAGE_DIR}/"
          mkdir -p "${PACKAGE_DIR}/patches"
          cp -r bridge/patches/* "${PACKAGE_DIR}/patches/"
          zip -r "${PACKAGE_DIR}.zip" "${PACKAGE_DIR}"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v7
        with:
          name: synfigstudio-windows-ucrt64-mcp
          path: synfigstudio-windows-ucrt64-mcp-*.zip
          if-no-files-found: error
          retention-days: 14

  smoke-test-linux:
    needs: build-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install minimal runtime dependencies (xvfb and GTK runtime)
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb \
            libgtkmm-3.0-dev libxml++2.6-dev libglibmm-2.4-dev libsigc++-2.0-dev \
            libmlt++-dev libmlt-dev libfftw3-dev libavcodec-dev libavformat-dev \
            libswscale-dev libmagick++-dev libopenexr-dev libharfbuzz-dev libmng-dev \
            libboost-all-dev libltdl-dev

      - name: Download Linux Artifact
        uses: actions/download-artifact@v8
        with:
          name: synfigstudio-linux-mcp
          path: download_linux

      - name: Extract and Run Headless Smoke Test
        run: |
          mkdir -p extracted_linux
          tar -xzf download_linux/*.tar.gz -C extracted_linux
          STUDIO_BIN=$(find extracted_linux -name synfigstudio -type f -perm /111 | head -n 1)
          echo "Found studio binary at: ${STUDIO_BIN}"
          STUDIO_DIR="$(cd "$(dirname "${STUDIO_BIN}")/.." && pwd)"
          echo "${STUDIO_DIR}/lib" | sudo tee /etc/ld.so.conf.d/synfig.conf
          sudo ldconfig
          export LD_LIBRARY_PATH="${STUDIO_DIR}/lib:${LD_LIBRARY_PATH}"
          export SYNFIG_MODULE_DIR="${STUDIO_DIR}/lib/synfig/modules"
          xvfb-run -a python3 bridge/scripts/clean_runner_smoke.py "${STUDIO_BIN}" || {
            echo "=== DUMPING LINUX SMOKE LOGS ==="
            cat /tmp/synfig_smoke_*/studio_smoke.log || true
            exit 1
          }

  smoke-test-windows:
    needs: build-windows
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Download Windows Artifact
        uses: actions/download-artifact@v8
        with:
          name: synfigstudio-windows-ucrt64-mcp
          path: download_windows

      - name: Extract and Run Clean-Runner Smoke Test
        shell: powershell
        run: |
          $zip = (Get-ChildItem -Path download_windows -Filter *.zip).FullName
          Expand-Archive -Path $zip -DestinationPath extracted_windows
          $studioBin = (Get-ChildItem -Path extracted_windows -Recurse -Filter synfigstudio.exe).FullName
          Write-Host "Found studio binary at: $studioBin"
          try {
            python bridge/scripts/clean_runner_smoke.py $studioBin
          } finally {
            Get-ChildItem -Path $env:TEMP -Filter studio_smoke.log -Recurse | ForEach-Object {
              Write-Host "=== DUMPING $($_.FullName) ==="
              Get-Content $_.FullName
              if ($env:GITHUB_STEP_SUMMARY) {
                Get-Content $_.FullName | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
              }
            }
          }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [smoke-test-linux, smoke-test-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Download Windows & Linux Artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Fetch pinned Synfig source for GPL bundle
        run: bash bridge/scripts/fetch_synfig.sh

      - name: Build GPL Source Bundle, Python Distributions & Checksums
        run: |
          python -m pip install --upgrade pip uv
          mkdir -p dist
          python bridge/scripts/package_gpl_source.py
          uv build --directory server --out-dir "$PWD/dist"
          find artifacts -type f \( -name "*.zip" -o -name "*.tar.gz" \) -exec cp {} dist/ \;
          (cd dist && sha256sum * > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Render Release Notes
        run: |
          python scripts/render_release_notes.py "$GITHUB_REF_NAME" dist > release_notes.md
          test -s release_notes.md
          test -s dist/SHA256SUMS.txt
          ls -lh dist release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: synfig-mcp ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: release_notes.md
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          fail_on_unmatched_files: true
          files: dist/*

  publish-container:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=synfig-mcp
            org.opencontainers.image.description=Model Context Protocol server for Synfig Studio
            org.opencontainers.image.licenses=MIT

      - name: Build and push container image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-pypi:
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_TO_PYPI == 'true'
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/synfig-mcp
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip uv
          uv build --directory server --out-dir "$PWD/dist"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
