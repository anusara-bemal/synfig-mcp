name: Bridge Build & Release

on:
  push:
    branches: [main, v*]
    tags: ['v*']
  pull_request:
    branches: [main, v*]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            cmake ninja-build pkg-config ccache intltool autopoint gettext \
            libxml++2.6-dev libsigc++-2.0-dev libglibmm-2.4-dev libgtkmm-3.0-dev \
            libmlt++-dev libmlt-dev libfftw3-dev libavcodec-dev libavformat-dev \
            libswscale-dev libmagick++-dev libopenexr-dev libboost-all-dev \
            libltdl-dev libharfbuzz-dev libmng-dev nlohmann-json3-dev xvfb

      - name: Fetch and build Synfig Studio
        run: |
          bash bridge/scripts/fetch_synfig.sh
          bash bridge/scripts/apply_patches.sh
          bash bridge/scripts/build_linux.sh

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./server[dev]"

      - name: Run Real Studio Tests under xvfb
        run: |
          export SYNFIG_STUDIO_PATH="${GITHUB_WORKSPACE}/build_synfig/build_linux/install/bin/synfigstudio"
          export SYNFIG_MCP_ENABLE=1
          xvfb-run -a pytest server/tests/e2e/test_live_mutate.py -m real_studio -v --durations=10

      - name: Package Linux Artifacts
        run: |
          PACKAGE_DIR="synfigstudio-linux-mcp-$(git rev-parse --short HEAD)"
          mkdir -p "${PACKAGE_DIR}"
          cp -r build_synfig/build_linux/install/* "${PACKAGE_DIR}/"
          cp bridge/GPL_NOTICE.txt "${PACKAGE_DIR}/"
          cp bridge/THIRD_PARTY_LICENSES.md "${PACKAGE_DIR}/"
          mkdir -p "${PACKAGE_DIR}/patches"
          cp -r bridge/patches/* "${PACKAGE_DIR}/patches/"
          tar -czvf "${PACKAGE_DIR}.tar.gz" "${PACKAGE_DIR}"

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: synfigstudio-linux-mcp
          path: synfigstudio-linux-mcp-*.tar.gz

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true

      - name: Run Windows Build
        shell: msys2 {0}
        run: |
          bash bridge/scripts/build_windows_msys2.sh

      - name: Bundle Windows Runtime Dependencies
        shell: msys2 {0}
        run: |
          python3 bridge/scripts/bundle_windows_deps.py --install-dir build_synfig/build_ucrt64/install --ucrt-dir /ucrt64

      - name: Package Windows Artifacts
        shell: msys2 {0}
        run: |
          PACKAGE_DIR="synfigstudio-windows-ucrt64-mcp-$(git rev-parse --short HEAD)"
          mkdir -p "${PACKAGE_DIR}"
          cp -r build_synfig/build_ucrt64/install/* "${PACKAGE_DIR}/"
          cp bridge/GPL_NOTICE.txt "${PACKAGE_DIR}/"
          cp bridge/THIRD_PARTY_LICENSES.md "${PACKAGE_DIR}/"
          mkdir -p "${PACKAGE_DIR}/patches"
          cp -r bridge/patches/* "${PACKAGE_DIR}/patches/"
          zip -r "${PACKAGE_DIR}.zip" "${PACKAGE_DIR}"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: synfigstudio-windows-ucrt64-mcp
          path: synfigstudio-windows-ucrt64-mcp-*.zip

  smoke-test-linux:
    needs: build-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install minimal runtime dependencies (xvfb and GTK runtime)
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb \
            libgtkmm-3.0-dev libxml++2.6-dev libglibmm-2.4-dev libsigc++-2.0-dev \
            libmlt++-dev libmlt-dev libfftw3-dev libavcodec-dev libavformat-dev \
            libswscale-dev libmagick++-dev libopenexr-dev libharfbuzz-dev libmng-dev

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: synfigstudio-linux-mcp
          path: download_linux

      - name: Extract and Run Headless Smoke Test
        run: |
          mkdir -p extracted_linux
          tar -xzf download_linux/*.tar.gz -C extracted_linux
          STUDIO_BIN=$(find extracted_linux -name synfigstudio -type f -perm /111 | head -n 1)
          echo "Found studio binary at: ${STUDIO_BIN}"
          STUDIO_DIR="$(cd "$(dirname "${STUDIO_BIN}")/.." && pwd)"
          export LD_LIBRARY_PATH="${STUDIO_DIR}/lib:${LD_LIBRARY_PATH}"
          export SYNFIG_MODULE_DIR="${STUDIO_DIR}/lib/synfig/modules"
          xvfb-run -a python3 bridge/scripts/clean_runner_smoke.py "${STUDIO_BIN}"

  smoke-test-windows:
    needs: build-windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: synfigstudio-windows-ucrt64-mcp
          path: download_windows

      - name: Extract and Run Clean-Runner Smoke Test
        shell: powershell
        run: |
          $zip = (Get-ChildItem -Path download_windows -Filter *.zip).FullName
          Expand-Archive -Path $zip -DestinationPath extracted_windows
          $studioBin = (Get-ChildItem -Path extracted_windows -Recurse -Filter synfigstudio.exe).FullName
          Write-Host "Found studio binary at: $studioBin"
          python bridge/scripts/clean_runner_smoke.py $studioBin

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [smoke-test-linux, smoke-test-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download Windows & Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Build GPL Source Bundle & Python Distributions
        run: |
          pip install uv
          mkdir -p dist
          python bridge/scripts/package_gpl_source.py
          uv build --directory server --out-dir dist
          find artifacts -type f \( -name "*.zip" -o -name "*.tar.gz" \) -exec cp {} dist/ \;
          sha256sum dist/* > dist/SHA256SUMS.txt
          cat dist/SHA256SUMS.txt

      - name: Create GitHub Pre-Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: |
            dist/*
          body_path: docs/gpl-compliance.md
