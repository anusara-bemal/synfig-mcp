name: Server CI

on:
  push:
    branches: [main, v*]
  pull_request:
    branches: [main, v*]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          cd server
          uv sync --locked --all-extras

      - name: Run poe check
        run: |
          cd server
          uv run poe check

  synfig-validity:
    name: Synfig document validity gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned Synfig engine
        env:
          SYNFIG_ENGINE_DIR: ${{ github.workspace }}/synfig-engine
        run: |
          # bsdtar (libarchive) unpacks the AppImage's zisofs filesystem without
          # FUSE.  The gate must run against the engine the project targets
          # (1.5.5), not the older build in the distribution's repositories.
          sudo apt-get update && sudo apt-get install -y libarchive-tools
          bash scripts/install_pinned_synfig.sh "${SYNFIG_ENGINE_DIR}"
          echo "${SYNFIG_ENGINE_DIR}" >> "${GITHUB_PATH}"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          cd server
          uv sync --locked --all-extras

      - name: Verify every generated document loads in Synfig
        run: |
          cd server
          uv run pytest tests/contract/test_sif_synfig_validity.py -v

      - name: Run the standalone validity verifier
        run: |
          cd server
          uv run python ../scripts/verify_synfig_validity.py

  docker-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t synfig-mcp:test .

      - name: Run synfig-mcp doctor inside container
        run: docker run --rm synfig-mcp:test doctor

      - name: Run headless render smoke test inside container
        run: |
          docker run --rm --entrypoint python3 synfig-mcp:test -c "
          import asyncio
          from synfig_mcp.backend.headless import HeadlessBackend
          async def test():
              backend = HeadlessBackend()
              doc = await backend.doc_new(160, 120, 24.0)
              print('Headless doc created:', doc.id)
              ok = await backend.render_frame(doc.id, '/tmp/test_frame.png', time=0.0)
              print('Headless render success:', ok)
              assert ok is True
          asyncio.run(test())
          "
