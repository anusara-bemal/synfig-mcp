name: Server CI

on:
  push:
    branches: [main, v*]
  pull_request:
    branches: [main, v*]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          cd server
          uv sync --all-extras

      - name: Run poe check
        run: |
          cd server
          uv run poe check

  docker-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t synfig-mcp:test .

      - name: Run synfig-mcp doctor inside container
        run: docker run --rm synfig-mcp:test doctor

      - name: Run headless render smoke test inside container
        run: |
          docker run --rm --entrypoint python3 synfig-mcp:test -c "
          import asyncio
          from synfig_mcp.backend.headless import HeadlessBackend
          async def test():
              backend = HeadlessBackend()
              doc = await backend.doc_new(160, 120, 24.0)
              print('Headless doc created:', doc.id)
              ok = await backend.render_frame(doc.id, '/tmp/test_frame.png', time=0.0)
              print('Headless render success:', ok)
              assert ok is True
          asyncio.run(test())
          "
