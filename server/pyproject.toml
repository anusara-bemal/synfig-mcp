[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "synfig-mcp"
version = "0.7.0rc3"
description = "Live MCP control of Synfig Studio (native bridge + headless fallback)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Synfig MCP Contributors" }
]
keywords = ["mcp", "synfig", "animation", "llm", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "mcp>=1.2.0",
    "pydantic>=2.7.0",
    "lxml>=5.2.0",
    "anyio>=4.3.0",
    "pillow>=10.3.0",
    "numpy>=1.26.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "structlog>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "poethepoet>=0.25.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "hypothesis>=6.100.0",
    "syrupy>=4.6.0",
    "bandit>=1.7.8",
    "types-jsonschema>=4.21.0.20240118",
    "types-lxml>=2024.4.14",
    "types-Pillow>=10.2.0.20240520",
    "tiktoken>=0.7.0",
]

[project.scripts]
synfig-mcp = "synfig_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/synfig_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "lxml.*",
    "jsonschema.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "real_studio: tests requiring real patched Synfig Studio binary",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.poe.tasks]
format = "ruff format src tests"
format-check = "ruff format --check src tests"
lint = "ruff check src tests"
lint-fix = "ruff check --fix src tests"
typecheck = "mypy src tests"
test = "pytest -m 'not real_studio' -rs"
live = "pytest -m real_studio -v -s"
check = ["format-check", "lint", "typecheck", "test"]
security = "bandit -r src/"
