[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "synfig-mcp"
version = "0.1.0"
description = "Production-grade Model Context Protocol server for Synfig Studio (2D vector animation)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Anusara Bemal (ABM)" }]
keywords = ["mcp", "synfig", "animation", "model-context-protocol", "2d-animation", "llm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Graphics :: Editors",
  "Topic :: Multimedia :: Video",
]
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.9,<2",
  "lxml>=4.9.3",
  "pydantic>=2.5",
  "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
synfig-mcp = "synfig_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/AnusaraBemal/synfig-mcp"
Documentation = "https://github.com/AnusaraBemal/synfig-mcp/tree/main/docs"
Source = "https://github.com/AnusaraBemal/synfig-mcp"
Issues = "https://github.com/AnusaraBemal/synfig-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/synfig_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error", "ignore::DeprecationWarning"]
markers = ["synfig: integration tests that require a synfig binary (auto-skipped otherwise)"]

[tool.coverage.run]
source = ["src/synfig_mcp"]
omit = ["*/__main__.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "S"]
ignore = ["S101", "S404", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["synfig_mcp"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
packages = "synfig_mcp"
strict = true
warn_unreachable = true
implicit_reexport = false

[[tool.mypy.overrides]]
module = ["lxml.*", "mcp.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# FastMCP's prompt/resource decorators are untyped in the SDK.
module = ["synfig_mcp.prompts.*", "synfig_mcp.resources.*"]
disallow_untyped_decorators = false
